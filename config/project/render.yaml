# Render Blueprint — deploy with "New + > Blueprint" in the Render
# dashboard, pointed at this repo. Render reads this file automatically.
#
# This deploys ONLY the FastAPI service (api.py), not the Tkinter
# desktop app — the desktop app has no place to run on a headless server.
services:
  - type: web
    name: shiftiq-api
    env: python
    plan: free
    buildCommand: pip install -r config/project/requirements-api.txt
    startCommand: uvicorn backend.api.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        # REQUIRED: Generate with: python -c "import secrets; print(secrets.token_hex(32))"
        # Set this in the Render dashboard → Environment — never commit the real value.
        sync: false
      - key: DATABASE_URL
        # REQUIRED for PostgreSQL: set in Render dashboard → Environment.
        # Leave blank to use SQLite (not recommended in production).
        sync: false
      - key: CORS_ORIGINS
        # REQUIRED: comma-separated list of allowed frontend origins, e.g.
        # https://app.shiftiq.com. The API refuses to start with a wildcard.
        sync: false
